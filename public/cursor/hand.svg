<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Original pointing-hand cursor: index finger up on the left, other fingers curled.
       Shapes are drawn three times (shadow, outline, fill) so the outline wraps the union. -->
