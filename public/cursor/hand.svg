    <g id="h">
      <rect x="6" y="1" width="5.6" height="15" rx="2.8"/>
      <rect x="5" y="10.5" width="17.5" height="14.5" rx="5"/>
      <circle cx="14" cy="12.2" r="2.6"/>
      <circle cx="17.6" cy="12.8" r="2.5"/>
      <circle cx="20.7" cy="14" r="2.3"/>
      <ellipse cx="5" cy="18" rx="2.3" ry="3.8" transform="rotate(-20 5 18)"/>
      <rect x="8" y="22" width="11.5" height="8.5" rx="2.5"/>
    </g>
  </defs>
  <use href="#h" transform="translate(1 1.2)" fill="#000" fill-opacity=".18" stroke="#000" stroke-opacity=".18" stroke-width="2.4"/>
  <use href="#h" fill="#5f6670" stroke="#5f6670" stroke-width="2.4" stroke-linejoin="round"/>
  <use href="#h" fill="#fff"/>
  <path d="M15.8 13.4v2.6M19.2 14.3v2.4M8.8 4.2h0" stroke="#c3c8ce" stroke-width="1.1" stroke-linecap="round" fill="none"/>
